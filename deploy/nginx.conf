# Reverse proxy for URA-Shree.
#
# Terminates TLS, speaks HTTP/2 to browsers, and proxies to the API over
# HTTP/1.1 - which is not an oversight: WebSocket upgrade is an HTTP/1.1
# mechanism and does not exist over HTTP/2 to an upstream.
#
# Two things here are load-bearing and easy to get wrong:
#   * WebSocket locations need Upgrade/Connection headers and a read timeout
#     long enough to survive a quiet agent turn. The 60s default closes the
#     socket mid-thought.
#   * proxy_buffering must be off for the streaming routes, or nginx holds the
#     tokens until the buffer fills and the reply arrives in lumps.

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format json escape=json '{"time":"$time_iso8601","remote":"$remote_addr",'
        '"method":"$request_method","path":"$uri","status":$status,'
        '"bytes":$body_bytes_sent,"duration":$request_time,'
        '"request_id":"$http_x_request_id","agent":"$http_user_agent"}';
    access_log /var/log/nginx/access.log json;

    sendfile on;
    tcp_nopush on;
    server_tokens off;
    client_max_body_size 32m;      # the upload endpoint caps well below this
    keepalive_timeout 75s;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/wasm image/svg+xml;
    gzip_min_length 1024;

    upstream shree_api {
        server api:8000;
        # A pool of idle upstream connections; without it every request pays a
        # fresh TCP handshake to the API.
        keepalive 32;
    }

    # Buckets are per client address. The API enforces its own per-user limits;
    # this one is in front of authentication, and stops an unauthenticated
    # flood from ever reaching Python.
    limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=1r/s;
    limit_conn_zone $binary_remote_addr zone=conn:10m;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Plain HTTP exists only to redirect and to answer ACME challenges.
    server {
        listen 80;
        listen [::]:80;
        server_name _;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }
        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        limit_conn conn 64;

        # Correlation id: reuse the client's if it sent one, so a trace spans
        # the whole hop chain, otherwise mint one here.
        proxy_set_header X-Request-Id $http_x_request_id;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;

        # Login and registration, where the cheap attack is guessing.
        location ~ ^/api/auth/(login|register) {
            limit_req zone=auth burst=5 nodelay;
            proxy_pass http://shree_api;
        }

        location /api/ {
            limit_req zone=api burst=40 nodelay;
            proxy_pass http://shree_api;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        location /ws/ {
            proxy_pass http://shree_api;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            # An agent turn can think for a long time between frames.
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
        }

        # The compiled frontend, served by the API's static mount. Hashed asset
        # filenames make them safe to cache forever; index.html never is, or a
        # deploy leaves clients on the old bundle.
        location /assets/ {
            proxy_pass http://shree_api;
            proxy_cache_valid 200 30d;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        location / {
            proxy_pass http://shree_api;
            add_header Cache-Control "no-cache";
        }
    }
}
