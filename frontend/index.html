<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Ura-Shree</title>
    <script>
      // Applied before first paint so a reload never flashes the wrong theme.
      (function () {
        try {
          var saved = localStorage.getItem('shree.theme') || 'system';
          var dark = saved === 'dark' || (saved === 'system' &&
            window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
          document.documentElement.dataset.accent =
            localStorage.getItem('shree.accent') || 'ember';
        } catch (e) {
          document.documentElement.dataset.theme = 'dark';
          document.documentElement.dataset.accent = 'ember';
        }
      })();

      // First-time visit: redirect to landing page until user has saved / opened app
      (function () {
        try {
          var params = new URLSearchParams(window.location.search);
          if (params.has('app') || window.location.hash.includes('app')) {
            localStorage.setItem('shree.saved', 'true');
            return;
          }
          var isSaved = localStorage.getItem('shree.saved') === 'true';
          if (!isSaved && (window.location.pathname === '/' || window.location.pathname === '/index.html')) {
            window.location.replace('/landing.html');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
